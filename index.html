<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jace Andrei's Christening</title>

<style>
    body {
        margin: 0;
        font-family: 'Georgia', serif;
        background-color: #f6f3ee;
        color: #333;
        text-align: center;
    }

    .section {
        padding: 2px 10px;
    }


    /* Images stay clean and centered */
    .invitation-image {
        width: 90%;
        max-width: 1000px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* Button container */
    .button-group {
        margin-top: 10px;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
        padding: 14px 28px;
        font-size: 16px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background-color: #c9a46c;
        color: white;
    }

    .btn-primary:hover {
        background-color: #b8935a;
        transform: translateY(-2px);
    }

    .btn-outline {
        background-color: transparent;
        border: 2px solid #c9a46c;
        color: #c9a46c;
    }

    .btn-outline:hover {
        background-color: #c9a46c;
        color: white;
        transform: translateY(-2px);
    }

    footer {
        margin-top: 40px;
        padding: 20px;
        font-size: 14px;
        color: #777;
    }
</style>
</head>

<body>

<!-- First Image -->
<div class="section">
    <img src="image1.png" alt="Christening Invitation" class="invitation-image">

    <!-- Two Buttons Beside Each Other -->
    <div class="button-group">
        <a href="#" class="btn btn-primary">RSVP Now</a>
        <a href=#section2 class="btn btn-outline">Open Map</a>
    </div>
</div>

<!-- Second Image -->
<div id="section2">
    <img src="image2.png" alt="Map to Reception" class="invitation-image">
</div>

</body>
</html>
